
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Violet Random</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="particles"></canvas>
  <div id="effects"></div>

  <div class="app-layout">
    <aside class="history-panel">
      <h2>DRAW HISTORY</h2>
      <p class="panel-subtitle">최근 10회 추첨 결과</p>

      <ol id="history-list">
        <li class="empty-history">아직 추첨 기록이 없어!</li>
      </ol>

      <div class="average-panel">
        <p>최근 10회 평균</p>
        <strong id="average">—</strong>
        <span id="average-status">10회 추첨 후 표시</span>
      </div>
    </aside>

    <main class="container">
      <div class="eyebrow">✦ RANDOM NUMBER GENERATOR ✦</div>
      <h1>Violet Random</h1>
      <p class="subtitle">운명을 결정할 단 하나의 숫자</p>

      <div class="number-box" id="number-box">
        <div class="number" id="number" aria-live="polite">
          <span>0</span><span>0</span><span>0</span><span>0</span>
          <span>0</span><span>0</span><span>0</span>
        </div>
      </div>

      <p class="status" id="status">준비 완료 · 추첨을 시작해 봐</p>

      <div class="button-area">
        <button id="instant-button" class="draw-button instant-button">
          <span class="button-icon">⚡</span>
          즉각 뽑기
          <span class="button-note">애니메이션 없이 바로 결과 확인</span>
        </button>

        <button id="draw-button" class="draw-button">
          <span class="button-icon">✦</span>
          숫자 뽑기
        </button>
      </div>

      <p class="footer">0 — 9,999,999 <span>•</span> SECURE RANDOM</p>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
